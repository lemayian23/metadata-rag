services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/ragpassword
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

  app:
    image: metadata-rag-app:latest
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - neo4j
    volumes:
      - hf_cache:/root/.cache/huggingface

volumes:
  pgdata:
  hf_cache:
  neo4jdata: